version: 1
services:
  python-service:
    root: python-service
    build:
      command: pip install -r requirements.txt
    deploy:
      command: uvicorn main:app --host 0.0.0.0 --port $PORT
    env:
      PORT: 3000
  node-service:
    root: node-service
    build:
      command: npm install
    deploy:
      command: npm start
    env:
      PYTHON_API_URL:
        fromService: python-service
        type: url
  web:
    root: web
    build:
      command: npm install && npm run build
    static:
      publish: dist
    env:
      VITE_NODE_API_URL:
        fromService: node-service
        type: url
